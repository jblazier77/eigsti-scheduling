<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eigsti Scheduling · Phone review</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#21372f;background:#edf1ed;font-size:17px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:48px;border:1px solid #c6d1c9;border-radius:10px;background:white;color:#21372f;padding:10px 15px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd7d25;outline-offset:2px}.shell{max-width:560px;margin:auto;background:#f8faf7;min-height:100vh;padding-bottom:110px}header{padding:24px 20px 16px;background:#153c30;color:#fff}header p{margin:5px 0 18px;color:#c8d9cd}.brand{font-size:14px;letter-spacing:2px;font-weight:750}h1{font-size:29px;margin:12px 0}h2{font-size:21px;margin:4px 0 12px}h3{font-size:19px;margin:0 0 8px}p{line-height:1.5}small,.muted{color:#596d61;font-size:14px}.review{background:#fff0cc;padding:12px 20px;color:#694411;font-size:13px;line-height:1.5}.switch{display:flex;gap:8px;align-items:center}.switch select{min-height:48px;border-radius:8px;width:100%;padding:8px;border:0;background:#fff;color:#153c30}main{padding:20px}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.stack{display:grid;gap:10px}.card{padding:18px;background:white;border:1px solid #d9e2d9;border-radius:14px;margin:14px 0}.badge{display:inline-block;font-size:13px;border-radius:5px;padding:4px 8px;background:#e2f0e4;color:#2a5638;margin-bottom:10px}.wait{background:#fff0cc;color:#735018}.primary{background:#216348;border-color:#216348;color:#fff}.full{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions button{padding:10px 6px}.note{border-left:3px solid #b68e4f;padding-left:12px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:flex;gap:6px;padding:12px;background:white;border-top:1px solid #d8e0d8}nav button{flex:1;border:0;font-size:14px}nav button[aria-current=page]{background:#dceade;font-weight:750}label{display:block;margin:16px 0 6px}input,textarea,main select{width:100%;padding:12px;border:1px solid #b8c8bc;border-radius:8px;min-height:48px;background:#fff}form button{margin-top:18px}#notice{margin:0 20px;padding:12px 0;color:#2e6044;line-height:1.4}a{color:#216348}button:disabled{opacity:.6;cursor:default}@media(max-width:360px){main{padding:14px}header{padding:20px 14px}nav button{padding:8px 3px}}
</style>
</head>
<body><div class="shell">
<div class="review">PHASE 0 · Synthetic interaction prototype. Changes last until refresh. No sign-in or server saves.</div>
<header><div class="brand">EIGSTI / SCHEDULING</div><h1 id="heading">My Week</h1><p>Make a plan. Keep the next step handy.</p><div class="switch"><label for="role" style="margin:0">Review as</label><select id="role"><option value="lead">Lead carpenter</option><option value="pm">Project manager</option><option value="helper">Helper</option><option value="admin">Admin</option></select></div></header>
<div id="notice" role="status" aria-live="polite"></div><main id="view"><p>Loading synthetic examples…</p></main><nav aria-label="Main"></nav>
</div>
<script>
let data, role='lead', page='week', allJobs=false, currentJob=null;
const $=s=>document.querySelector(s), escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const job=id=>data.jobs.find(j=>j.id===id), work=id=>data.work.find(w=>w.id===id), person=()=>role==='helper'?'helper-01':'lead-01';
const button=(label,action,id='',klass='')=>`<button class="${klass}" data-action="${action}" data-id="${escape(id)}">${label}</button>`;
function relevant(j){if(role==='pm')return allJobs||j.responsiblePm==='pm-01';if(role==='helper')return data.visits.some(v=>work(v.workId).jobId===j.id&&v.participants.some(p=>p.userId===person()));return data.work.some(w=>w.jobId===j.id&&w.leadId===person())||data.visits.some(v=>work(v.workId).jobId===j.id&&v.participants.some(p=>p.userId===person()));}
function jobCard(j){const w=data.work.find(w=>w.jobId===j.id);return `<article class="card"><span class="badge ${w.readiness==='ready'?'':'wait'}">${w.readiness==='ready'?'Ready':w.readiness==='waiting_unknown'?'Waiting · date unknown':'Waiting · '+escape(w.waitDate)}</span><h3>${escape(j.title)}</h3><p class="muted">${escape(j.customer)}</p><p>${escape(j.scope)}</p>${button('Open job','job',j.id,'full')}</article>`;}
function render(){
  $('#notice').textContent='';
  const menus=role==='admin'?[['admin','People & settings']]:role==='helper'?[['week','My Schedule']]:role==='pm'?[['jobs','Jobs'],['week','Schedule']]:[['week','My Week'],['jobs','My Jobs']];
  $('nav').innerHTML=menus.map(([id,label])=>`<button data-action="nav" data-id="${id}" ${id===page?'aria-current="page"':''}>${label}</button>`).join('');
  if(page==='job'){renderJob();return;}
  if(page==='plan'){renderPlan();return;}
  if(page==='done'){ $('#heading').textContent='Done here';$('#view').innerHTML=`<h2>${escape(job(currentJob).title)}</h2><p>Is your portion finished, or is there work to return for?</p><div class="stack">${button('My part is finished','finish',currentJob,'primary')}${button('Need a return visit','return',currentJob)}${button('Back','job',currentJob)}</div><p class="muted">Finishing your portion does not close the whole project.</p>`;return;}
  if(page==='new'){ $('#heading').textContent='New job';$('#view').innerHTML=`<p>Start with the basics. Add more later.</p><form id="new-job"><label for="customer">Customer name</label><input id="customer" name="customer" required maxlength="100"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required maxlength="40"><label for="address">Job address</label><input id="address" name="address" required maxlength="200"><button class="primary full">Create demo job</button></form><p class="muted">Synthetic entries only. This creates a default portion of work behind the scenes.</p>`;return;}
  if(page==='sub'){ $('#heading').textContent='Add sub visit';$('#view').innerHTML=`<form id="sub"><h2>${escape(job(currentJob).title)}</h2><label for="trade">Trade/contact</label><select id="trade" name="trade"><option>Demo Electrician</option><option>Demo Plumber</option></select><label for="sub-date">Date</label><input id="sub-date" name="date" type="date" value="2026-10-23" required><p>Time: <strong>Not set</strong></p><label for="certainty">Status</label><select id="certainty" name="certainty"><option value="confirmed">Confirmed</option><option value="tentative">Tentative</option></select><button class="primary full">Add demo commitment</button></form><p class="muted">A subcontractor commitment does not reserve an internal staff member.</p>`;return;}
  if(page==='admin'){ $('#heading').textContent='People & settings';$('#view').innerHTML=`<h2>Company administration</h2><p>Planned phone operations for the real app:</p><div class="card"><h3>Users and access</h3><p>Invite an individual, assign roles, deactivate access.</p></div><div class="card"><h3>Trade contacts</h3><p>Maintain names and phone numbers.</p></div><div class="card"><h3>Working calendar</h3><p>Company hours and half-day conventions need confirmation.</p></div><p class="muted">These operations are not implemented in this prototype.</p>`;return;}
  if(page==='jobs'){ $('#heading').textContent=role==='pm'?'Jobs':'My Jobs';const list=data.jobs.filter(relevant);$('#view').innerHTML=(role==='pm'?`<div class="row">${button(allJobs?'Show My Jobs':'Show All Jobs','toggle')}${button('New job','new','','primary')}</div>`:'<h2>Your work, in priority order</h2><p class="muted">Waiting work stays visible.</p>')+list.map(jobCard).join('');return;}
  $('#heading').textContent=role==='helper'?'My Schedule':role==='pm'?'Shared schedule':'My Week';
  const visits=data.visits.filter(v=>role==='pm'||v.participants.some(p=>p.userId===person())).sort((a,b)=>a.startDate.localeCompare(b.startDate));
  $('#view').innerHTML='<div class="row"><h2>Upcoming work</h2><span class="muted">Day list</span></div>'+visits.map(v=>{const j=job(work(v.workId).jobId), lead=v.participants.find(p=>p.role==='leading');const helpers=v.participants.filter(p=>p.role==='helping').map(p=>data.users.find(u=>u.id===p.userId).name);return `<article class="card"><span class="badge ${v.certainty==='tentative'?'wait':''}">${escape(v.startDate)} · ${escape(v.slot.replace('_',' '))}</span><h3>${escape(j.title)}</h3><p>${escape(work(v.workId).description)}</p><p class="muted">${escape(data.users.find(u=>u.id===lead.userId).name)} · ${escape(v.status)} · ${escape(v.certainty)}</p><p class="muted">${helpers.length?'Helping: '+escape(helpers.join(', ')):v.requiredHelpers?'Help needed':'No help assigned'}</p>${role==='helper'?`<p>${escape(j.preparation)}</p>`:''}<div class="actions">${button('Job details','job',j.id)}${role==='lead'&&v.status==='planned'?button('Done here','done',j.id):''}</div></article>`;}).join('')+`<h2>Sub commitments</h2>`+data.commitments.filter(c=>role==='pm'||relevant(job(c.jobId))).map(c=>`<div class="card"><h3>${escape(c.trade)}</h3><p>${escape(c.startDate)} · Time not set · ${escape(c.certainty)}</p><p class="muted">${escape(job(c.jobId).title)}</p></div>`).join('');
}
function renderJob(){ const j=job(currentJob), portions=data.work.filter(w=>w.jobId===j.id);$('#heading').textContent='Job details';$('#view').innerHTML=`<h2>${escape(j.title)}</h2><p>${escape(j.customer)}</p><p>${escape(j.address)}</p><div class="actions">${button('Call customer','demo-contact')}${button('Directions','demo-contact')}</div><p class="muted">Phone and address actions disabled for these fictional examples.</p><div class="card"><h3>Scope</h3><p>${escape(j.scope)}</p><p>${escape(j.preparation)}</p></div>${portions.map(w=>`<div class="card"><h3>${escape(w.description)}</h3><p>${escape(w.readiness)} · ${escape(w.completion)}</p>${w.remainingNote?`<p class="note">${escape(w.remainingNote)}</p>`:''}</div>`).join('')}${role==='helper'?'':`<div class="stack">${button('Plan work','plan',j.id,'primary')}${button('Add sub visit','sub',j.id)}</div>`}<h3 style="margin-top:24px">Upcoming trade visits</h3>${data.commitments.filter(c=>c.jobId===j.id).map(c=>`<p>${escape(c.trade)} · ${escape(c.startDate)} · Time not set</p>`).join('')||'<p class="muted">None recorded.</p>'}`; }
function renderPlan(){ $('#heading').textContent='Plan work';const owned=data.work.find(w=>w.jobId===currentJob&&(role==='pm'||w.leadId==='lead-01'));if(!owned?.leadId){$('#view').innerHTML=`<p>Assign a responsible lead before planning this work. Staff assignment is planned for Phase 2.</p>${button('Back to job','job',currentJob)}`;return;}$('#view').innerHTML=`<h2>${escape(job(currentJob).title)}</h2><form id="plan"><label for="date">Which day?</label><input id="date" name="date" type="date" value="2026-10-21" required><label for="slot">How much of the day?</label><select id="slot" name="slot"><option value="all_day">All day</option><option value="morning">Morning</option><option value="afternoon">Afternoon</option></select><button class="primary full">Add to demo week</button></form><p class="muted">Interaction review only. Live conflict checks, exact hours and multi-day controls come in Phase 2.</p>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const {action,id}=b.dataset;if(action==='demo-contact'){$('#notice').textContent='Fictional contact. Real call and directions actions are planned for Phase 1.';return;}if(action==='toggle'){allJobs=!allJobs;}else if(action==='nav'){page=id;}else if(action==='finish'||action==='return'){const w=data.work.find(w=>w.jobId===currentJob&&w.leadId==='lead-01');if(!w){$('#notice').textContent='This example has no portion owned by Demo Lead 1.';return;}const v=data.visits.find(v=>v.workId===w.id&&v.status==='planned');if(v)v.status='completed';if(action==='return'){w.remainingNote='Return needed — remaining trim. No date promised.';w.completion='open';}else w.completion='completed';page='job';render();$('#notice').textContent='Demo updated in memory. Overall job remains open.';return;}else{page=action;if(id)currentJob=id;}render();window.scrollTo(0,0);});
$('#role').addEventListener('change',e=>{role=e.target.value;page=role==='admin'?'admin':role==='pm'?'jobs':'week';render();});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target, values=Object.fromEntries(new FormData(f));if(f.id==='plan'){const w=data.work.find(w=>w.jobId===currentJob&&(role==='pm'||w.leadId==='lead-01'));data.visits.push({id:crypto.randomUUID(),workId:w.id,startDate:values.date,endDate:values.date,slot:values.slot,status:'planned',certainty:'tentative',requiredHelpers:0,participants:[{userId:w.leadId,role:'leading'}]});page='week';}else if(f.id==='new-job'){const id=crypto.randomUUID();data.jobs.push({id,customer:values.customer,phone:values.phone,address:values.address,title:values.customer+' — '+values.address,responsiblePm:'pm-01',lifecycle:'open',scope:'Add scope when known.',preparation:''});data.work.push({id:crypto.randomUUID(),jobId:id,description:'Whole job',leadId:null,readiness:'ready',completion:'open',remainingNote:''});page='jobs';}else if(f.id==='sub'){data.commitments.push({id:crypto.randomUUID(),jobId:currentJob,trade:values.trade,startDate:values.date,certainty:values.certainty,time:null});page='job';}render();$('#notice').textContent='Demo updated in memory only. Refresh resets the examples.';});
fetch('/demo.json').then(r=>{if(!r.ok)throw Error('fixture');return r.json();}).then(d=>{data=d;render();}).catch(()=>{$('#view').textContent='Could not load synthetic examples. Run npm run seed and use the preview server.';});
</script></body></html>
